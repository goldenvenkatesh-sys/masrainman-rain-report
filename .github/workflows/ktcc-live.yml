name: KTCC rainfall so far (every hour)

# KTCC = Kancheepuram, Tiruvallur, Chennai, Chengalpattu. Same "rain since 08:30 so far" picture as the
# Tamil Nadu one (tn-live.yml), with only the gauges of those four districts.
# Started by tn-live.yml every hour (so it follows the same timer and the MasRainman scheduled task),
# and also by its own timer below at :47 IST. Run again within 40 minutes it does nothing.
on:
  schedule:
    - cron: "17 * * * *"        # :47 IST, after TN-SMART's :30 values are up
  workflow_dispatch:
    inputs:
      always:
        description: "make the picture even if nothing changed (yes/no)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: ktcc-live
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - id: c
        env:
          ALWAYS: ${{ github.event.inputs.always }}
        run: |
          made=$(curl -s "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/reports/index.json?t=$(date +%s)" | python3 -c "
          import json,sys
          try: d=json.load(sys.stdin)
          except Exception: d={'reports':[]}
          print(max([r['made'] for r in d['reports'] if r['region']=='ktcc' and r['kind']=='live'] or ['']))")
          skip=no
          if [ "$ALWAYS" != yes ] && [ -n "$made" ]; then
            age=$(( ( $(date +%s) - $(date -d "$made" +%s) ) / 60 ))
            echo "Last KTCC live picture: $made ($age min ago)"
            [ "$age" -lt 40 ] && skip=yes
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"; echo "skip=$skip"

  live:
    needs: check
    if: needs.check.outputs.skip != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0 ffmpeg
          pip install -r requirements.txt

      # holds data/raw/live/ktcc_<day>.json, the station totals added up so far
      - name: Restore running totals
        uses: actions/cache@v4
        with:
          path: data/raw
          key: ktcclive-${{ github.run_id }}
          restore-keys: ktcclive-

      - name: Make picture
        run: python ktcc.py live ${{ github.event.inputs.always == 'yes' && '--always' || '' }}

      - name: Save to the reports branch (website + GitHub app)
        if: ${{ hashFiles('out/rain_ktcc_*.mp4') != '' }}
        continue-on-error: true
        env:
          WN3_DISPATCH_TOKEN: ${{ secrets.WN3_DISPATCH_TOKEN }}
        run: bash publish_reports.sh out

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('out/rain_ktcc_*.mp4') != '' }}
        with:
          name: ktcc-rain-live
          path: out/
          retention-days: 7
