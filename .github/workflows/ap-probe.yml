name: AP probe (temporary)
on:
  push:
    branches: [claude/project-thread-0clxg1]
    paths: [tools/probe_ap.py, .github/workflows/ap-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python tools/probe_ap.py
      - name: Save pages to branch ap-probe-data
        run: |
          cd probe_out
          git init -q -b ap-probe-data && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm "AP probe pages"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ap-probe-data
