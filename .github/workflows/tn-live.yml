name: TN rainfall so far (every hour)

# Every hour at :45 IST (also started by the hourly MasRainman scheduled task, since GitHub's timer
# often skips runs). Starts Karnataka and Andhra Pradesh too. Tamil Nadu: take TN-SMART's running file,
# add any new rain to the station totals saved by earlier runs, and post the picture
# "rain since 08:30 so far". The full 24 hours (08:30 to 08:30) is the 09:45 TN rainfall report.
on:
  schedule:
    # minute 15 UTC = :45 IST, so the :30 hourly values are uploaded first
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      send:
        description: "send to Telegram (yes/no; blank = only on the 2-hourly slots 10:45, 12:45 … IST)"
        default: ""
      always:
        description: "make the picture even if nothing changed (yes/no)"
        default: "no"

permissions:
  contents: write
  actions: write

concurrency:
  group: tn-live
  cancel-in-progress: false

jobs:
  # The timer and the scheduled task can both start this hour's run: do it once.
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.c.outputs.skip }}
      send: ${{ steps.c.outputs.send }}
    steps:
      - id: c
        env:
          SEND: ${{ github.event.inputs.send }}
          ALWAYS: ${{ github.event.inputs.always }}
        run: |
          H=$(TZ=Asia/Kolkata date +%-H)
          if [ -z "$SEND" ]; then
            if [ $((H % 2)) -eq 0 ]; then SEND=yes; else SEND=no; fi
          fi
          echo "send=$SEND" >> "$GITHUB_OUTPUT"
          made=$(curl -s "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/reports/index.json?t=$(date +%s)" | python3 -c "
          import json,sys
          try: d=json.load(sys.stdin)
          except Exception: d={'reports':[]}
          print(max([r['made'] for r in d['reports'] if r['region']=='tn' and r['kind']=='live'] or ['']))")
          skip=no
          if [ "$ALWAYS" != yes ] && [ -n "$made" ]; then
            age=$(( ( $(date +%s) - $(date -d "$made" +%s) ) / 60 ))
            echo "Last TN live picture: $made ($age min ago)"
            [ "$age" -lt 40 ] && skip=yes
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"; echo "skip=$skip send=$SEND"

  live:
    needs: check
    if: needs.check.outputs.skip != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Karnataka and Andhra Pradesh run at the same time as this one
      - name: Start Karnataka and Andhra Pradesh live reports
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in ka-live.yml ap-live.yml; do
            gh workflow run "$wf" -R "$GITHUB_REPOSITORY" --ref main \
              -f send="${{ needs.check.outputs.send }}" -f always="${{ github.event.inputs.always || 'no' }}" \
              && echo "started $wf"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0 ffmpeg
          pip install -r requirements.txt

      # holds data/raw/live/<day>.json, the station totals added up so far
      - name: Restore running totals
        uses: actions/cache@v4
        with:
          path: data/raw
          key: tnlive-${{ github.run_id }}
          restore-keys: tnlive-

      - name: Make picture
        run: python rain_report.py live ${{ github.event.inputs.always == 'yes' && '--always' || '' }}

      - name: Save to the reports branch (website + GitHub app)
        if: ${{ hashFiles('out/*.mp4') != '' }}
        continue-on-error: true
        env:
          WN3_DISPATCH_TOKEN: ${{ secrets.WN3_DISPATCH_TOKEN }}
        run: bash publish_reports.sh out

      - name: Send to Telegram
        continue-on-error: true
        if: ${{ needs.check.outputs.send == 'yes' && hashFiles('out/*.mp4') != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.RAIN_REPORT_CHAT_IDS || secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py out/*.mp4

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('out/*.mp4') != '' }}
        with:
          name: rain-live
          path: out/
          retention-days: 7
