name: Andhra Pradesh rainfall so far (every hour)

# Every 2 hours from 10:45 am to 6:45 am IST (same times as Tamil Nadu and Karnataka), take the DES / APSDPS station feed
# (rain since 08:30), add any new rain to the station totals saved by earlier runs, and post the picture
# "rain since 08:30 so far" on a white background.
on:
  # started by the TN live run each time (GitHub kept skipping a separate timer for this one)
  workflow_dispatch:
    inputs:
      always:
        description: "make the picture even if nothing changed (yes/no)"
        default: "no"
      past24:
        description: "also make the past-24-hours video for this rain-day YYYY-MM-DD (blank = automatic, once after 08:30)"
        default: ""

permissions:
  contents: write

concurrency:
  group: ap-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        timeout-minutes: 10
        run: |
          # no apt-get: GitHub's Ubuntu mirrors sometimes stop resolving and apt then hangs
          # until the job times out. Pillow wheels bundle raqm (Tamil shaping) and
          # imageio-ffmpeg ships ffmpeg, so pip alone is enough.
          pip install -r requirements.txt

      # holds data/raw/live/ap_<day>.json (station totals so far)
      - name: Restore running totals
        uses: actions/cache@v4
        with:
          path: data/raw
          key: aplive-${{ github.run_id }}
          restore-keys: aplive-

      # backup for the 09:55 daily report: if GitHub skipped that run, save the finished rain-day here
      # (DES shows only the latest day, so a day not saved before the next 08:30 is lost)
      - name: Save finished rain-day if missing
        continue-on-error: true
        run: |
          python ap_fetch.py daily --if-missing
          bash save_ap.sh

      - name: Make picture
        run: python rain_report.py live --region ap ${{ github.event.inputs.always == 'yes' && '--always' || '' }}

      # once a day after 08:30: the finished rain-day replayed hour by hour, from this workflow's hourly snapshots
      - name: Past 24 hours video (hour by hour)
        continue-on-error: true
        env:
          WN3_DISPATCH_TOKEN: ${{ secrets.WN3_DISPATCH_TOKEN }}
          WN3_READ_TOKEN: ${{ secrets.WN3_READ_TOKEN }}
          WN3_RAIN_URL: https://wn3data.masrainman-wn3.pages.dev/wn3_{D}.json
        run: bash live24_due.sh ap "${{ github.event.inputs.past24 }}"

      - name: Save to the reports branch (website + GitHub app)
        if: ${{ hashFiles('out/*.mp4') != '' }}
        continue-on-error: true
        env:
          WN3_DISPATCH_TOKEN: ${{ secrets.WN3_DISPATCH_TOKEN }}
        run: bash publish_reports.sh out

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('out/*.mp4') != '' }}
        with:
          name: rain-ap-live
          path: out/
          retention-days: 7
