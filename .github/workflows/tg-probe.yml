name: Telangana source probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch TGDPS pages
        run: |
          mkdir -p probe && cd probe
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36 (MasRainman rainfall report)"
          i=0
          for u in \
            https://tgdps.telangana.gov.in/ http://tgdps.telangana.gov.in/ https://tsdps.telangana.gov.in/ \
            https://tgdps.telangana.gov.in/livejsp/Nalgonda.jsp https://tgdps.telangana.gov.in/livejsp/Rangareddy.jsp \
            https://tgdps.telangana.gov.in/mandaldata.jsp?s1=1 https://tgdps.telangana.gov.in/districtdata.jsp \
            https://tgdps.telangana.gov.in/rainfall_abstract.jsp https://tgdps.telangana.gov.in/aws.jsp \
            https://tgdps.telangana.gov.in/values.jsp?s1=10936 https://tgdps.telangana.gov.in/robots.txt \
            https://tgdps.telangana.gov.in/livemap.jsp https://tgdps.telangana.gov.in/map.jsp \
            https://tgdps.telangana.gov.in/hourly.jsp https://tgdps.telangana.gov.in/Live.jsp ; do
            i=$((i+1)); f=$(printf "%02d" $i)_$(echo "$u" | sed 's#https\?://##; s#[^A-Za-z0-9._-]#_#g')
            echo "== $u" | tee -a index.txt
            curl -sSkL -m 60 -A "$UA" -D "$f.hdr" -o "$f.html" -w "%{http_code} %{size_download} %{url_effective}\n" "$u" 2>&1 | tee -a index.txt || true
          done
          # every link / script / ajax url mentioned
          cat *.html 2>/dev/null | grep -oiE '(href|src|action|url)\s*[=:]\s*["'"'"'][^"'"'"']+' | sort -u > links.txt || true
          wc -l links.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tg-probe
          path: probe/
