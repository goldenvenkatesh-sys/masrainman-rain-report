name: Automated Weather Report & Telegram Update

on:
  schedule:
    - cron: '0 */3 * * *'  # Runs every 3 hours automatically
  workflow_dispatch:        # Allows you to trigger it manually from GitHub anytime

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests python-telegram-bot pytz

      - name: Run Weather Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python bot.py
