name: AP test (temporary)
on:
  push:
    branches: [claude/project-thread-0clxg1]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0 ffmpeg
          pip install -r requirements.txt
      - run: python rain_report.py live --region ap --always
      - name: Save picture to branch ap-probe-data
        run: |
          mkdir s && cp out/*.png out/*.txt data/raw/live/*.json s/ && cd s
          git init -q -b ap-probe-data && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm "AP test"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ap-probe-data
