name: Satellite rain (GPM) once a day

# Once a day at about 9:10 am IST: satellite rain for Tamil Nadu, Karnataka and Andhra Pradesh
#  - "Satellite rain, past 24 hours": NASA/JAXA IMERG Early, the 48 newest half-hours added up
#  - "Satellite radar 3D": each GPM radar pass with rain over the state in the last 24 hours
# Saved to the reports branch like the other reports (website Rain reports page).
# Needs a free NASA Earthdata login as two secrets: EARTHDATA_USER and EARTHDATA_PASS.
on:
  schedule:
    - cron: "40 3 * * *"        # 09:10 IST
  workflow_dispatch:
    inputs:
      region:
        description: "tn ka ap (any of them)"
        default: "tn ka ap"
      what:
        description: "both, sat24 (24-hour map) or gpm3d (radar 3D)"
        default: "both"

permissions:
  contents: write

concurrency:
  group: gpm-sat
  cancel-in-progress: false

jobs:
  sat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt h5py matplotlib

      - name: Check NASA login
        env:
          EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
          EARTHDATA_PASS: ${{ secrets.EARTHDATA_PASS }}
        run: |
          if [ -z "$EARTHDATA_USER" ] || [ -z "$EARTHDATA_PASS" ]; then
            echo "::error::Add the EARTHDATA_USER and EARTHDATA_PASS secrets (free account at urs.earthdata.nasa.gov)."
            exit 1
          fi

      - name: Make satellite reports
        env:
          EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
          EARTHDATA_PASS: ${{ secrets.EARTHDATA_PASS }}
        run: python gpm_sat.py --region "${{ github.event.inputs.region || 'tn ka ap' }}" --what "${{ github.event.inputs.what || 'both' }}"

      - name: Save to the reports branch (website + GitHub app)
        if: ${{ hashFiles('out/*.mp4') != '' }}
        env:
          WN3_DISPATCH_TOKEN: ${{ secrets.WN3_DISPATCH_TOKEN }}
        run: bash publish_reports.sh out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpm-sat
          path: out/
          retention-days: 7
