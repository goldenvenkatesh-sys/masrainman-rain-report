name: TN data audit (temporary)
on:
  workflow_dispatch:
    inputs:
      start: {default: "2026-10-01"}
      end: {default: "2026-11-08"}
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached TN-SMART days
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: tnsmart-none
          restore-keys: tnsmart-
      - name: Collect cached + fresh copies
        run: |
          mkdir -p audit/cached audit/fresh
          cp data/raw/hourly_rainfall_*.json audit/cached/ 2>/dev/null || true
          ls -la --time-style=full-iso data/raw > audit/cached_listing.txt 2>&1 || true
          d="${{ github.event.inputs.start }}"
          while [ "$(date -d "$d" +%s)" -le "$(date -d "${{ github.event.inputs.end }}" +%s)" ]; do
            curl -s --retry 3 -m 90 -A "Mozilla/5.0 (MasRainman rainfall report)" \
              -e "https://beta-tnsmart.rimes.int/index.php/RTDAS/Hourly_data_TNDRRA_c/public" \
              -o "audit/fresh/hourly_rainfall_$d.json" \
              "https://beta-tnsmart.rimes.int/Rainfall_Python_IDW/Hourly_json/hourly_rainfall_$d.json?t=$(date +%s%N)"
            d=$(date -I -d "$d + 1 day")
          done
          ls -la audit/fresh audit/cached | head -100
      - name: Push to temporary branch
        run: |
          cd audit
          git init -q -b audit-tmp && git add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm audit
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" audit-tmp
