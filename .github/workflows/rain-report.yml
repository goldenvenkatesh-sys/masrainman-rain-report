name: TN rainfall report

on:
  schedule:
    - cron: "15 4 * * *"        # 09:45 IST  Tamil Nadu (TN-SMART) + Andhra Pradesh (DES / APSDPS)
    - cron: "45 6 * * *"        # 12:15 IST  Kerala (IMD file comes out ~11 am)
  workflow_dispatch:
    inputs:
      region:
        description: "tn, kl, ap, several (tn ap), or both (= all three)"
        default: "tn"
      mode:
        description: "daily, accum, both, live24 (TN past-24-hours video only), or month (last month's total)"
        default: "both"
      date:
        description: "daily: rain-day YYYY-MM-DD (blank = latest)"
        default: ""
      start:
        description: "accum: start YYYY-MM-DD (blank = Oct 1)"
        default: ""
      end:
        description: "accum: end YYYY-MM-DD (blank = latest)"
        default: ""

permissions:
  contents: write

# Kerala archive and the rainfall report both save data/kerala: run them one at a time.
concurrency:
  group: kerala-files
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0 ffmpeg
          pip install -r requirements.txt

      - name: Cache downloaded TN-SMART days
        uses: actions/cache@v4
        with:
          path: data/raw
          key: tnsmart-${{ github.run_id }}
          restore-keys: tnsmart-

      - name: Pick region
        id: pick
        run: |
          R="${{ github.event.inputs.region }}"
          R=$(echo "$R" | tr ',' ' ')
          if [ "$R" = both ]; then R="tn kl ap"; fi
          if [ -z "$R" ]; then
            case "${{ github.event.schedule }}" in
              "45 6 * * *") R=kl ;;
              *) R="tn ap" ;;
            esac
          fi
          echo "region=$R" >> "$GITHUB_OUTPUT"

      - name: Update Kerala files (IMD)
        if: contains(steps.pick.outputs.region, 'kl')
        run: |
          python fetch_kerala.py
          python kerala_extra.py
          python kerala_data.py
          bash save_kerala.sh

      - name: Update Andhra Pradesh files (DES)
        if: contains(steps.pick.outputs.region, 'ap')
        run: |
          python ap_fetch.py daily
          bash save_ap.sh

      - name: Make reports
        env:
          REGION: ${{ steps.pick.outputs.region }}
          MODE: ${{ github.event.inputs.mode || 'both' }}
          DAY: ${{ github.event.inputs.date }}
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
          SCHEDULED: ${{ github.event.schedule }}
          # live24 reads the WeatherNext 3 24-h rain from the weathernext3 repo with this token
          WN3_DISPATCH_TOKEN: ${{ secrets.WN3_DISPATCH_TOKEN }}
          WN3_READ_TOKEN: ${{ secrets.WN3_READ_TOKEN }}
        run: |
          for R in tn kl ap; do
            case " $REGION " in *" $R "*) ;; *) continue ;; esac
            if [ "$MODE" = "daily" ] || [ "$MODE" = "both" ]; then
              python rain_report.py daily --region $R ${DAY:+--date $DAY}
            fi
            # Tamil Nadu: the same rain-day replayed hour by hour (1080x1350 video)
            if [ "$R" = tn ] && { [ "$MODE" = "daily" ] || [ "$MODE" = "both" ] || [ "$MODE" = "live24" ]; }; then
              python rain_report.py live24 --region tn ${DAY:+--date $DAY} || echo "No past-24-hours video"
            fi
            if [ "$MODE" = "accum" ] || [ "$MODE" = "both" ]; then
              python rain_report.py accum --region $R ${START:+--start $START} ${END:+--end $END}
            fi
            # whole-month total: once a month on the 1st, and on a manual "month" run
            if [ "$MODE" = "month" ] || { [ -n "$SCHEDULED" ] && [ "$(TZ=Asia/Kolkata date +%d)" = "01" ]; }; then
              python rain_report.py accum --region $R --month last || echo "No month report for $R"
            fi
          done

      - name: Save to the reports branch (website + GitHub app)
        if: ${{ hashFiles('out/*.mp4') != '' }}
        continue-on-error: true
        env:
          WN3_DISPATCH_TOKEN: ${{ secrets.WN3_DISPATCH_TOKEN }}
        run: bash publish_reports.sh out

      - uses: actions/upload-artifact@v4
        with:
          name: rain-report
          path: out/
          retention-days: 14
