name: TN rainfall report

on:
  schedule:
    - cron: "15 4 * * *"        # 09:45 IST  Tamil Nadu (TN-SMART)
    - cron: "45 6 * * *"        # 12:15 IST  Kerala (IMD file comes out ~11 am)
  workflow_dispatch:
    inputs:
      region:
        description: "tn, kl, or both"
        default: "tn"
      mode:
        description: "daily, accum, both, or month (last month's total)"
        default: "both"
      date:
        description: "daily: rain-day YYYY-MM-DD (blank = latest)"
        default: ""
      start:
        description: "accum: start YYYY-MM-DD (blank = Oct 1)"
        default: ""
      end:
        description: "accum: end YYYY-MM-DD (blank = latest)"
        default: ""
      send:
        description: "send to Telegram (yes/no)"
        default: "yes"

permissions:
  contents: write

# Kerala archive and the rainfall report both save data/kerala: run them one at a time.
concurrency:
  group: kerala-files
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0 ffmpeg
          pip install -r requirements.txt

      - name: Cache downloaded TN-SMART days
        uses: actions/cache@v4
        with:
          path: data/raw
          key: tnsmart-${{ github.run_id }}
          restore-keys: tnsmart-

      - name: Pick region
        id: pick
        run: |
          R="${{ github.event.inputs.region }}"
          if [ -z "$R" ]; then
            if [ "${{ github.event.schedule }}" = "45 6 * * *" ]; then R=kl; else R=tn; fi
          fi
          echo "region=$R" >> "$GITHUB_OUTPUT"

      - name: Update Kerala files (IMD)
        if: steps.pick.outputs.region != 'tn'
        run: |
          python fetch_kerala.py
          python kerala_extra.py
          python kerala_data.py
          bash save_kerala.sh

      - name: Make reports
        env:
          REGION: ${{ steps.pick.outputs.region }}
          MODE: ${{ github.event.inputs.mode || 'both' }}
          DAY: ${{ github.event.inputs.date }}
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
          SCHEDULED: ${{ github.event.schedule }}
        run: |
          for R in tn kl; do
            if [ "$REGION" != "$R" ] && [ "$REGION" != "both" ]; then continue; fi
            if [ "$MODE" = "daily" ] || [ "$MODE" = "both" ]; then
              python rain_report.py daily --region $R ${DAY:+--date $DAY}
            fi
            if [ "$MODE" = "accum" ] || [ "$MODE" = "both" ]; then
              python rain_report.py accum --region $R ${START:+--start $START} ${END:+--end $END}
            fi
            # whole-month total: once a month on the 1st, and on a manual "month" run
            if [ "$MODE" = "month" ] || { [ -n "$SCHEDULED" ] && [ "$(TZ=Asia/Kolkata date +%d)" = "01" ]; }; then
              python rain_report.py accum --region $R --month last || echo "No month report for $R"
            fi
          done

      - name: Send to Telegram
        if: ${{ github.event.inputs.send != 'no' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.RAIN_REPORT_CHAT_IDS || secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}               # GitHub download backup (publish_github.py)
        run: python send_telegram.py out/*.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: rain-report
          path: out/
          retention-days: 14
