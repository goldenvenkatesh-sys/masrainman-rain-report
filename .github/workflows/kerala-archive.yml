name: Kerala rainfall archive

on:
  schedule:
    - cron: "15 5 * * *"     # 10:45 IST
    - cron: "15 8 * * *"     # 13:45 IST
    - cron: "15 12 * * *"    # 17:45 IST
  workflow_dispatch:

permissions:
  contents: write

# Kerala archive and the rainfall report both save data/kerala: run them one at a time.
concurrency:
  group: kerala-files
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pdfplumber
      - run: python fetch_kerala.py
      - run: python kerala_data.py
      - name: Save to repo
        run: bash save_kerala.sh
